deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: 's3'
    bucketNames:
      chunks: prod-loki-logs-2026-ap-south-1
      ruler: prod-loki-logs-2026-ap-south-1
      admin: prod-loki-logs-2026-ap-south-1
    s3:
      region: ap-south-1
      insecure: false
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 0s
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
serviceAccount:
  create: true
  name: loki

chunksCache:
  enabled: false
resultsCache:
  enabled: false
